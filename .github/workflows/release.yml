name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux VPS：musl 静态链接，任何发行版直接跑
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # 本机（Windows）直接可用
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross toolchain (aarch64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          STAGE="baidu-t5-proxy-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/baidu-t5-proxy" "$STAGE/"
          cp "target/${{ matrix.target }}/release/fake-baidu" "$STAGE/"
          cp nodes.txt README.md baidu-t5-proxy.service "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "baidu-t5-proxy-$($env:GITHUB_REF_NAME -replace '^v','')-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/baidu-t5-proxy.exe" $stage
          Copy-Item "target/${{ matrix.target }}/release/fake-baidu.exe" $stage
          Copy-Item nodes.txt,README.md,baidu-t5-proxy.service $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Add-Content $env:GITHUB_ENV "ASSET=$stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-image:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Verify pushed image
        run: |
          set -euo pipefail
          docker pull ghcr.io/${{ github.repository }}:latest
          # 二进制必须是真身：--help 输出 usage
          docker run --rm ghcr.io/${{ github.repository }}:latest --help \
            | grep -q "usage: baidu-t5-proxy"
          # 容器必须能常驻（防占位二进制静默退出回归）
          printf '10001 127.0.0.1 44444\n' > /tmp/nodes.txt
          docker run -d --name verify --network host \
            -v /tmp/nodes.txt:/etc/baidu-t5-proxy/nodes.txt:ro \
            ghcr.io/${{ github.repository }}:latest
          sleep 5
          [ "$(docker inspect -f '{{.State.Running}}' verify)" = "true" ] \
            || { docker logs verify; exit 1; }
          docker logs verify | grep -q "1 port(s) up"
          docker rm -f verify >/dev/null

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
